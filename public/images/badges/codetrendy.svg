<svg xmlns="http://www.w3.org/2000/svg" width="220" height="56" viewBox="0 0 220 56" role="img" aria-label="Featured on CodeTrendy">
  <defs>
    <clipPath id="logoClip"><circle cx="32" cy="28" r="20" /></clipPath>
    <clipPath id="cardClip"><rect width="220" height="56" rx="10" /></clipPath>
  </defs>

  <!-- Card -->
  <rect width="220" height="56" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Divider between logo area and text -->
  <line x1="58" y1="10" x2="58" y2="46" stroke="#e2e8f0" stroke-width="1" />

  <!-- Logo circle bg -->
  <circle cx="32" cy="28" r="20" fill="#F2B23314" />

  <!-- Logo image clipped to circle -->
  <image href="data:image/svg+xml;base64," x="16" y="12" width="32" height="32" clip-path="url(#logoClip)" preserveAspectRatio="xMidYMid meet" />

  <!-- Text -->
  <text x="64" y="23" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" font-weight="800" letter-spacing="1.4" fill="#F2B233">FEATURED ON</text>
  <text x="64" y="40" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="800" letter-spacing="-0.3" fill="#0f172a">CodeTrendy</text>
</svg>