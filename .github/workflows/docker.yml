name: Docker Prod

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Deploy build skips typecheck/lint (next.config.ts ignoreBuildErrors);
  # this job is the gate for those instead, off the deploy critical path.
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint]
    # Lint has pre-existing react-hooks errors; advisory until they are fixed.
    continue-on-error: ${{ matrix.check == 'lint' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.check }}

  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Create env file
        run: |
          echo NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME }} > .env
          echo NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_URL }} >> .env
          echo NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} >> .env
          echo NEXT_PUBLIC_SUPPORT_EMAIL=${{ secrets.NEXT_PUBLIC_SUPPORT_EMAIL }} >> .env
          echo NEXT_PUBLIC_GITHUB_URL=${{ secrets.NEXT_PUBLIC_GITHUB_URL }} >> .env
          echo NEXT_PUBLIC_DISCORD_URL=${{ secrets.NEXT_PUBLIC_DISCORD_URL }} >> .env
          echo NEXT_PUBLIC_TWITTER_HANDLE=${{ secrets.NEXT_PUBLIC_TWITTER_HANDLE }} >> .env
          echo NEXT_PUBLIC_TRUSTPILOT_URL=${{ secrets.NEXT_PUBLIC_TRUSTPILOT_URL }} >> .env
          echo NEXT_PUBLIC_REDDIT_URL=${{ secrets.NEXT_PUBLIC_REDDIT_URL }} >> .env
          echo NEXT_PUBLIC_YOUTUBE_URL=${{ secrets.NEXT_PUBLIC_YOUTUBE_URL }} >> .env
          echo NEXT_PUBLIC_TELEGRAM_URL=${{ secrets.NEXT_PUBLIC_TELEGRAM_URL }} >> .env

          echo SYSTEM_ACCESS_TOKEN=${{ secrets.SYSTEM_ACCESS_TOKEN }} >> .env
          echo SESSION_SECRET=${{ secrets.SESSION_SECRET }} >> .env

          echo TURSO_DATABASE_URL=${{ secrets.TURSO_DATABASE_URL }} >> .env
          echo TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }} >> .env

          echo R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }} >> .env
          echo R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }} >> .env
          echo R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }} >> .env
          echo R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }} >> .env
          echo R2_BUCKET=${{ secrets.R2_BUCKET }} >> .env

          echo TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }} >> .env

          echo GUEST_API_KEY=${{ secrets.GUEST_API_KEY }} >> .env

          echo NEXT_PUBLIC_POSTHOG_DISABLED=${{ secrets.NEXT_PUBLIC_POSTHOG_DISABLED }} >> .env
          echo NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }} >> .env
          echo NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }} >> .env
          echo POSTHOG_PROXY_HOST=${{ secrets.POSTHOG_PROXY_HOST }} >> .env
          echo POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }} >> .env
          echo POSTHOG_ENV_ID=${{ secrets.POSTHOG_ENV_ID }} >> .env

          echo INDEXNOW_KEY=${{ secrets.INDEXNOW_KEY }} >> .env

          echo 'WEB_BOT_AUTH_PUBLIC_JWKS=${{ secrets.WEB_BOT_AUTH_PUBLIC_JWKS }}' >> .env
          echo 'WEB_BOT_AUTH_PRIVATE_JWK=${{ secrets.WEB_BOT_AUTH_PRIVATE_JWK }}' >> .env

          echo CREEM_API_KEY=${{ secrets.CREEM_API_KEY }} >> .env
          echo CREEM_API_URL=${{ secrets.CREEM_API_URL }} >> .env
          echo CREEM_MODERATION_ENABLED=${{ secrets.CREEM_MODERATION_ENABLED }} >> .env

      - name: Docker build
        run: docker compose build

      - name: Rolling deploy
        # Replicas recreate ONE AT A TIME: a plain --force-recreate restarts
        # both at once and takes the site down for the whole boot window.
        # --remove-orphans on the final up: a service renamed/removed from the
        # compose file keeps running with the SAME Traefik labels otherwise,
        # so Traefik round-robins across MISMATCHED builds and clients get 404
        # chunks from whichever replica lacks them (ChunkLoadError).
        run: |
          for svc in unorouter-b unorouter-a; do
            docker compose up -d --no-deps --force-recreate "$svc"
            healthy=0
            for i in {1..36}; do
              status="$(docker inspect --format='{{.State.Health.Status}}' "$svc" 2>/dev/null || echo unknown)"
              if [ "$status" = "healthy" ]; then healthy=1; break; fi
              echo "waiting for $svc ($status) ... $i/36"
              sleep 5
            done
            if [ "$healthy" != "1" ]; then
              echo "::error::$svc did not become healthy; aborting before touching the other replica"
              exit 1
            fi
          done
          docker compose up -d --remove-orphans

      - name: Wait for site to be healthy
        run: |
          # Cache-busted (unique query per try): Cloudflare briefly caches
          # 404s from the container swap window, which starved this gate
          # even after the new container was healthy.
          for i in {1..60}; do
            if curl -fsS "${{ secrets.NEXT_PUBLIC_URL }}/sitemap.xml?hc=$i-$RANDOM" > /dev/null; then
              echo "Site is up"
              exit 0
            fi
            echo "Waiting for site... ($i/60)"
            sleep 5
          done
          echo "Site did not come up in time"
          exit 1

      # Anonymous HTML is edge-cached 10min via a Cloudflare Cache Rule;
      # purge after each deploy so cached HTML never references chunk
      # hashes the new container no longer serves (also clears any 404s
      # cached during the swap).
      - name: Purge Cloudflare cache
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "X-Auth-Email: ${{ secrets.CLOUDFLARE_EMAIL }}" \
            -H "X-Auth-Key: ${{ secrets.CLOUDFLARE_API_KEY }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Assert sitemap has model pages
        run: |
          # Guards the localhost-self-call / build-prerender regression that
          # silently emptied every model page from the sitemap.
          sitemap="$(curl -fsS "${{ secrets.NEXT_PUBLIC_URL }}/sitemap.xml")"
          total="$(printf '%s' "$sitemap" | grep -oc '<loc>' || true)"
          models="$(printf '%s' "$sitemap" \
            | grep -oE '<loc>[^<]*</loc>' \
            | grep -E '/(models|modeles|modelle|moxing|mo-hinh|moderu|modelli|modelos|modeu|modeller|model|modele)/[^<]+' \
            | grep -vc '/blog/' || true)"
          echo "sitemap: $total total URLs, $models model pages"
          if [ "${models:-0}" -lt 100 ]; then
            echo "::error::sitemap has $models model pages (expected >=100). Pricing self-call likely failing; see src/lib/rpc.ts + sitemap.ts."
            exit 1
          fi

      - name: Submit to IndexNow
        run: |
          mkdir -p "$HOME/.cache/indexnow-bun"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/scripts":/scripts:ro \
            -v "$HOME/.cache/indexnow-bun":/tmp/.bun/install/cache \
            -e INDEXNOW_KEY="${{ secrets.INDEXNOW_KEY }}" \
            -e NEXT_PUBLIC_URL="${{ secrets.NEXT_PUBLIC_URL }}" \
            -e HOME=/tmp \
            oven/bun:1-alpine \
            sh -c "mkdir -p /tmp/run && cp /scripts/indexnow.ts /tmp/run/ && cd /tmp/run && bun add indexnow-submitter --no-save && bun indexnow.ts"
        continue-on-error: true

  # Only the default locale prerenders at build (PRERENDER_LOCALES); walk the
  # sitemap after deploy so the remaining locale pages ISR-render warm instead
  # of on a visitor's first hit.
  warm:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Warm ISR cache from sitemap
        run: |
          curl -fsS "${{ secrets.NEXT_PUBLIC_URL }}/sitemap.xml" \
            | grep -oE '<loc>[^<]+</loc>' \
            | sed -E 's#</?loc>##g' > urls.txt
          echo "warming $(wc -l < urls.txt) urls"
          xargs -P 6 -n 1 -a urls.txt -I{} \
            curl -s -o /dev/null -w '%{http_code} {}\n' --max-time 30 {} \
            | { grep -v '^200 ' || true; }
