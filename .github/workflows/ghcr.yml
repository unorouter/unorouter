name: GHCR Image

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Per-arch native runners (arm64 host builds arm64 natively; QEMU-emulating the
    # Next/turbopack compile is prohibitively slow). Each pushes a per-arch digest;
    # the manifest job stitches them into one multi-arch tag.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Same full .env as the don build: Next.js inlines NEXT_PUBLIC_* and the SSG
      # prerender needs server creds. The image therefore CONTAINS secrets -> the
      # ghcr package MUST stay PRIVATE (repo is public; verify package visibility).
      - name: Create env file
        run: |
          echo NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME }} > .env
          echo NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_URL }} >> .env
          echo NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} >> .env
          echo NEXT_PUBLIC_SUPPORT_EMAIL=${{ secrets.NEXT_PUBLIC_SUPPORT_EMAIL }} >> .env
          echo NEXT_PUBLIC_GITHUB_URL=${{ secrets.NEXT_PUBLIC_GITHUB_URL }} >> .env
          echo NEXT_PUBLIC_DISCORD_URL=${{ secrets.NEXT_PUBLIC_DISCORD_URL }} >> .env
          echo NEXT_PUBLIC_TWITTER_HANDLE=${{ secrets.NEXT_PUBLIC_TWITTER_HANDLE }} >> .env
          echo NEXT_PUBLIC_TRUSTPILOT_URL=${{ secrets.NEXT_PUBLIC_TRUSTPILOT_URL }} >> .env
          echo NEXT_PUBLIC_REDDIT_URL=${{ secrets.NEXT_PUBLIC_REDDIT_URL }} >> .env
          echo NEXT_PUBLIC_YOUTUBE_URL=${{ secrets.NEXT_PUBLIC_YOUTUBE_URL }} >> .env
          echo NEXT_PUBLIC_TELEGRAM_URL=${{ secrets.NEXT_PUBLIC_TELEGRAM_URL }} >> .env
          echo SYSTEM_ACCESS_TOKEN=${{ secrets.SYSTEM_ACCESS_TOKEN }} >> .env
          echo SESSION_SECRET=${{ secrets.SESSION_SECRET }} >> .env
          echo TURSO_DATABASE_URL=${{ secrets.TURSO_DATABASE_URL }} >> .env
          echo TURSO_AUTH_TOKEN=${{ secrets.TURSO_AUTH_TOKEN }} >> .env
          echo TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }} >> .env
          echo GUEST_API_KEY=${{ secrets.GUEST_API_KEY }} >> .env
          echo NEXT_PUBLIC_POSTHOG_DISABLED=${{ secrets.NEXT_PUBLIC_POSTHOG_DISABLED }} >> .env
          echo NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }} >> .env
          echo NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }} >> .env
          echo POSTHOG_PROXY_HOST=${{ secrets.POSTHOG_PROXY_HOST }} >> .env
          echo POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }} >> .env
          echo POSTHOG_ENV_ID=${{ secrets.POSTHOG_ENV_ID }} >> .env
          echo INDEXNOW_KEY=${{ secrets.INDEXNOW_KEY }} >> .env
          echo 'WEB_BOT_AUTH_PUBLIC_JWKS=${{ secrets.WEB_BOT_AUTH_PUBLIC_JWKS }}' >> .env
          echo 'WEB_BOT_AUTH_PRIVATE_JWK=${{ secrets.WEB_BOT_AUTH_PRIVATE_JWK }}' >> .env
          echo CREEM_API_KEY=${{ secrets.CREEM_API_KEY }} >> .env
          echo CREEM_API_URL=${{ secrets.CREEM_API_URL }} >> .env
          echo CREEM_MODERATION_ENABLED=${{ secrets.CREEM_MODERATION_ENABLED }} >> .env

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build+push a per-arch DIGEST only (no shared tag; two runners pushing the
      # same tag would clobber each other). The manifest job assembles the tags.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          outputs: type=image,name=ghcr.io/unorouter/unorouter,push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scope so the amd64 and arm64 GHA caches never overwrite.
          cache-from: type=gha,scope=unorouter-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=unorouter-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Stitch the two per-arch digests into one multi-arch manifest under the real tags.
  manifest:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push manifest list
        run: |
          IMAGE=ghcr.io/unorouter/unorouter
          REFS=""
          for f in /tmp/digests/*; do REFS="$REFS $IMAGE@$(cat "$f")"; done
          for TAG in latest ${{ github.sha }}; do
            docker buildx imagetools create -t "$IMAGE:$TAG" $REFS
          done
          docker buildx imagetools inspect "$IMAGE:${{ github.sha }}"
