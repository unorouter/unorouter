# unorouter (Next.js BFF, one compiled Bun binary on distroless). NEXT_PUBLIC_* baked at build;
# every other value comes from the unorouter-env Secret at runtime; the image carries no .env.
apiVersion: v1
kind: Service
metadata:
  name: unorouter
  namespace: services
spec:
  selector: { app: unorouter }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unorouter
  namespace: services
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: unorouter }
  template:
    metadata:
      labels: { app: unorouter }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      affinity:
        # keep these pods off node1: prometheus lives there, and this container's heap
        # grows toward its 3Gi limit between the 2h restarts, which is exactly the burst
        # that has tipped a co-located node into kernel OOM kills three times.
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [unorouter-node1]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: unorouter }
                topologyKey: kubernetes.io/hostname
      priorityClassName: serving
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: unorouter
          # pinned by the unorouter repo's GHCR workflow (deploy job); ArgoCD rolls it out.
          # NEVER set this back to :latest -- a floating tag never changes the manifest, so
          # ArgoCD sees no diff and the deploy silently does not happen.
          image: ghcr.io/unorouter/unorouter:19234878c628ba2f4ade21ad7b00f15cba4f9a05@sha256:69445432709cb63dd17f0fef888e61449f4c44f0e6d2f5b7991c5ccf1bc88596
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          # heaviest service on the fleet: ~1.1Gi steady as a compiled binary (the whole
          # static tree is served from memory). Request must match that or the scheduler
          # overpacks nodes; limit is ~2x peak.
          resources:
            requests: { memory: 1536Mi, cpu: "1" }
            limits: { memory: 3Gi }
          envFrom:
            - secretRef: { name: unorouter-env }
          ports:
            - containerPort: 3000
          # readiness gates traffic on deps (db/upstream); generous timeout, deps can be slow
          readinessProbe:
            httpGet: { path: /api/ops/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          # liveness must be process-local ONLY: killing the pod cannot fix a slow external
          # dep, it just crashloops the whole frontend (2026-07-23 incident)
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
# mcp: stateless npx package, no secrets
apiVersion: v1
kind: Service
metadata:
  name: unorouter-mcp
  namespace: services
spec:
  selector: { app: unorouter-mcp }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unorouter-mcp
  namespace: services
spec:
  replicas: 1
  selector:
    matchLabels: { app: unorouter-mcp }
  template:
    metadata:
      labels: { app: unorouter-mcp }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mcp
          image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          # 0.2.2 bundles its dependencies, so this pin fixes every line of code that runs
          command: [npx, -y, --package=unorouter-mcp@0.2.2, unorouter-mcp-http]
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 256Mi }
          env:
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
