# unorouter (Next.js BFF). NEXT_PUBLIC_* baked at build; server env at runtime wins over the
# image's .env (dotenv semantics). PRIVATE image (build bakes secrets) -> ghcr-pull.
apiVersion: v1
kind: Service
metadata:
  name: unorouter
  namespace: services
spec:
  selector: { app: unorouter }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unorouter
  namespace: services
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: unorouter }
  template:
    metadata:
      labels: { app: unorouter }
    spec:
      affinity:
        # keep these pods off node1: prometheus lives there, and this container's heap
        # grows toward its 3Gi limit between the 2h restarts, which is exactly the burst
        # that has tipped a co-located node into kernel OOM kills three times.
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [unorouter-node1]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: unorouter }
                topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: unorouter
          # pinned by the unorouter repo's GHCR workflow (deploy job); ArgoCD rolls it out.
          # NEVER set this back to :latest -- a floating tag never changes the manifest, so
          # ArgoCD sees no diff and the deploy silently does not happen.
          image: ghcr.io/unorouter/unorouter:33f14075ac7cb8a9f7dcc2e62ae805775a8f2200
          # heaviest service on the fleet: ~950Mi steady (Next.js SSR). Request must match
          # that or the scheduler overpacks nodes; limit is ~2x peak.
          resources:
            requests: { memory: 1Gi, cpu: "1" }
            limits: { memory: 3Gi }
          envFrom:
            - secretRef: { name: unorouter-env }
          env:
            # V8 sizes its heap from the HOST's RAM, not the cgroup limit, so it picked a
            # ~1120MB ceiling and hit "Ineffective mark-compacts" while half the limit sat
            # unused. Keep this below the limit so V8 GCs hard before the kernel OOM-kills.
            # Headroom over the steady ~1GB absorbs an unidentified slow climb that was
            # OOM-killing both replicas hourly and 524ing the site.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=2560"
          ports:
            - containerPort: 3000
          # readiness gates traffic on deps (db/upstream); generous timeout, deps can be slow
          readinessProbe:
            httpGet: { path: /api/ops/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          # liveness must be process-local ONLY: killing the pod cannot fix a slow external
          # dep, it just crashloops the whole frontend (2026-07-23 incident)
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
# mcp: stateless npx package, no secrets
apiVersion: v1
kind: Service
metadata:
  name: unorouter-mcp
  namespace: services
spec:
  selector: { app: unorouter-mcp }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unorouter-mcp
  namespace: services
spec:
  replicas: 1
  selector:
    matchLabels: { app: unorouter-mcp }
  template:
    metadata:
      labels: { app: unorouter-mcp }
    spec:
      containers:
        - name: mcp
          image: node:22-alpine
          command: [npx, -y, --package=unorouter-mcp@0.2.1, unorouter-mcp-http]
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 256Mi }
          env:
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
