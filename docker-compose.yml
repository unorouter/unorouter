networks:
  proxy:
    external: false
    name: proxy
  unorouter-internal:
    name: unorouter-internal

services:
  unorouter:
    restart: always
    build:
      context: ./
      dockerfile: Dockerfile
      target: prod
    deploy:
      replicas: 3
    depends_on:
      unorouter-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env
    environment:
      - INTERNAL_API_URL=http://unorouter-new-api:3000
      - REDIS_URL=redis://unorouter-redis:6379
    networks:
      - proxy
      - unorouter-internal
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.unorouter.rule=Host(`unorouter.ai`) || Host(`www.unorouter.ai`) || Host(`status.unorouter.ai`) || Host(`www.status.unorouter.ai`)"
      - "traefik.http.routers.unorouter.entrypoints=websecure"
      - "traefik.http.routers.unorouter.tls.certresolver=letsencrypt"
      - "traefik.http.routers.unorouter.service=unorouter"
      - "traefik.http.services.unorouter.loadbalancer.server.port=3000"
      # PostHog reverse proxy (avoids ad blockers)
      - "traefik.http.routers.posthog-proxy-uno.rule=Host(`${POSTHOG_PROXY_HOST}`)"
      - "traefik.http.routers.posthog-proxy-uno.entrypoints=websecure"
      - "traefik.http.routers.posthog-proxy-uno.tls.certresolver=letsencrypt"
      - "traefik.http.routers.posthog-proxy-uno.service=posthog-ext-uno"
      - "traefik.http.services.posthog-ext-uno.loadbalancer.server.url=https://eu.i.posthog.com"
      - "traefik.http.services.posthog-ext-uno.loadbalancer.passHostHeader=false"

  unorouter-redis:
    container_name: unorouter-redis
    image: redis:7-alpine
    restart: always
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - unorouter-internal
    labels:
      - "traefik.enable=false"
