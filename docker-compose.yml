networks:
  proxy:
    external: false
    name: proxy
  # Attachable swarm overlay of the new-api stack: server-side upstream calls
  # (INTERNAL_API_URL) go container-to-container instead of looping out through
  # Cloudflare, whose ~100s idle timeout 524'd slow first-byte chat streams.
  newapi-overlay:
    external: true
    name: newapi-overlay

# Two identical replicas sharing ONE Traefik service label; the docker provider
# aggregates same-service containers into one round-robin backend (no swarm, no
# WRR file). The playground sweeper self-elects a single owner via a Turso lease,
# so running it in both is safe.
x-unorouter: &unorouter
  restart: always
  build:
    context: ./
    dockerfile: Dockerfile
    target: prod
  healthcheck:
    test:
      [
        "CMD",
        "wget",
        "-q",
        "-O",
        "/dev/null",
        "http://127.0.0.1:3000/api/ops/health",
      ]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s
  env_file:
    - .env
  # Runtime-only (NOT .env: that file is baked into the image and the build
  # container cannot reach the overlay, which fails SSG pricing fetches).
  environment:
    INTERNAL_API_URL: http://newapi_newapi-slave:3000
  networks:
    - proxy
    - newapi-overlay
  labels:
    - "autoheal=true"
    - "traefik.enable=true"
    - "traefik.docker.network=proxy"
    - "traefik.http.routers.unorouter.rule=Host(`unorouter.com`) || Host(`www.unorouter.com`) || Host(`status.unorouter.com`) || Host(`www.status.unorouter.com`)"
    - "traefik.http.routers.unorouter.entrypoints=websecure"
    - "traefik.http.routers.unorouter.tls.certresolver=letsencrypt"
    - "traefik.http.routers.unorouter.service=unorouter"
    - "traefik.http.services.unorouter.loadbalancer.server.port=3000"
    # Traefik routes to any RUNNING container regardless of docker health;
    # without this probe a freshly recreated replica takes traffic while the
    # server is still booting (502s during every deploy).
    - "traefik.http.services.unorouter.loadbalancer.healthcheck.path=/api/ops/health"
    - "traefik.http.services.unorouter.loadbalancer.healthcheck.interval=5s"
    - "traefik.http.services.unorouter.loadbalancer.healthcheck.timeout=3s"
    # PostHog reverse proxy (avoids ad blockers)
    - "traefik.http.routers.posthog-proxy-uno.rule=Host(`${POSTHOG_PROXY_HOST}`)"
    - "traefik.http.routers.posthog-proxy-uno.entrypoints=websecure"
    - "traefik.http.routers.posthog-proxy-uno.tls.certresolver=letsencrypt"
    - "traefik.http.routers.posthog-proxy-uno.service=posthog-ext-uno"
    - "traefik.http.services.posthog-ext-uno.loadbalancer.server.url=https://eu.i.posthog.com"
    - "traefik.http.services.posthog-ext-uno.loadbalancer.passHostHeader=false"

services:
  unorouter-a:
    <<: *unorouter
    container_name: unorouter-a

  unorouter-b:
    <<: *unorouter
    container_name: unorouter-b
